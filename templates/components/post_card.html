{% load static %}
<article class="post-card">
    {% if post.cover %}<a class="post-card__image" href="{% url 'news-detail' post.slug %}"><img src="{% static post.cover %}" alt="" loading="lazy"></a>{% endif %}
    <div class="post-card__body"><p class="post-card__meta">{{ post.published_at|date:'F j, Y' }} <span>{{ post.category }}</span></p><h2><a href="{% url 'news-detail' post.slug %}">{{ post.title }}</a></h2><p>{{ post.excerpt|striptags|truncatewords:32 }}</p><a class="text-link" href="{% url 'news-detail' post.slug %}">Read More <span aria-hidden="true">&#8594;</span></a></div>
</article>
